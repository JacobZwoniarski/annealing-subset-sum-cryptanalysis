[project]
name = "annealing-subset-sum-cryptanalysis"
version = "0.1.0"
description = "Educational Merkle-Hellman subset-sum cryptanalysis with QUBO and annealing solvers."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Jacob Zwoniarski" }
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "dimod>=0.12",
  "dwave-neal>=0.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
notebook = [
  "jupyterlab>=4.0"
]

[project.scripts]
annealing-crypto-demo = "annealing_crypto.cli.demo:main"
annealing-crypto-benchmark = "annealing_crypto.cli.benchmark:main"
annealing-crypto-plots = "annealing_crypto.cli.plots:main"
annealing-crypto-summary = "annealing_crypto.cli.summary:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annealing_crypto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
